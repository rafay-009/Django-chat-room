services:
  db:
    image: postgres:15-alpine
    container_name: chatapp-db
    environment:
      POSTGRES_DB: chatdb
      POSTGRES_USER: chatuser
      POSTGRES_PASSWORD: chatpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatuser"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatapp-web
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && daphne -b 0.0.0.0 -p 8000 chatproject.asgi:application"
    ports:
      - "8000:8000"
    environment:
      DEBUG: "False"
      SECRET_KEY: django-insecure-sk1_pm2gm#u87yyk2l9n2qj5i$37&n%(9r)c2$s@30h!p3m544
      ALLOWED_HOSTS: localhost,127.0.0.1,web
      DATABASE_URL: postgresql://chatuser:chatpassword@db:5432/chatdb
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
